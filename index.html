<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16bce9">
<title>Little Stars - 3D Kids Learning</title>
<style>
:root{--ink:#26345f;--pink:#ff3f9d;--blue:#168eea;--green:#16b85e;--gold:#ffb51b}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#09baf4 0%,#a5efff 48%,#8eea9b 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#fff 1.5px,transparent 1.5px);background-size:28px 28px}
header{position:relative;text-align:center;padding:14px 10px 18px;background:linear-gradient(180deg,#168cf4,#56d7ff 70%,#9ff4c0);border-bottom:6px solid #fff;box-shadow:0 8px 0 #137fc4,0 14px 22px #124e8870;overflow:hidden}
header:before,header:after{content:"⭐";position:absolute;font-size:35px;top:22px;filter:drop-shadow(0 4px 2px #85550066);animation:float 3s ease-in-out infinite}
header:before{left:5%}header:after{right:5%;animation-delay:1s}
@keyframes float{50%{transform:translateY(-9px) rotate(12deg)}}
.logo{font-size:42px;filter:drop-shadow(0 5px 2px #3336);animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}
h1{margin:0;font-size:clamp(32px,7vw,54px);font-weight:1000;letter-spacing:1px;color:#fff;text-shadow:0 3px 0 #0875b5,0 6px 0 #075b9b,0 9px 10px #173c7c88}
header p{margin:4px;color:#fff;font-weight:900;text-shadow:0 2px 2px #155b8a}
.stars{display:inline-block;margin-top:8px;background:linear-gradient(#fff8a8,#ffbd25);border:3px solid #fff;border-radius:28px;padding:8px 18px;font-weight:1000;color:#743900;box-shadow:0 5px 0 #c77a00,0 8px 12px #1236}
main{max-width:1100px;margin:auto;padding:15px}
.welcome{position:relative;background:linear-gradient(145deg,#fff,#ffe8f5);border:5px solid white;border-radius:28px;padding:18px 14px;text-align:center;box-shadow:0 8px 0 #d58bb8,0 13px 18px #245b7a55;overflow:hidden}
.welcome:after{content:"🎈";position:absolute;right:13px;top:8px;font-size:34px}
.welcome h2{margin:3px 0 8px;color:#ef3693;font-size:clamp(23px,5vw,34px);text-shadow:0 2px #ffc3e1}
.welcome p{font-size:17px;font-weight:800;margin:8px}
button{font-family:inherit;border:0;border-radius:16px;padding:11px 16px;margin:5px;font-size:15px;font-weight:1000;color:#fff;background:linear-gradient(#46caff,#0879dc);box-shadow:0 5px 0 #0755a5,0 8px 12px #244b6a55;cursor:pointer;transition:transform .15s,filter .15s}
button:active,.card:active,.tile:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 #555}
button.primary{background:linear-gradient(#ff83c4,#ed2388);box-shadow:0 5px 0 #a80d60,0 8px 12px #244b6a55}
button.green{background:linear-gradient(#7df27d,#16a84f);box-shadow:0 5px 0 #087232}
button.gold{background:linear-gradient(#ffe878,#ff9d12);box-shadow:0 5px 0 #b76500;color:#663000}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.card{min-width:0;position:relative;border:4px solid #fff;border-radius:25px;overflow:hidden;background:linear-gradient(#fff,#e9faff);text-align:center;cursor:pointer;box-shadow:0 7px 0 #1682b6,0 12px 17px #174e7555;transition:transform .18s;transform-style:preserve-3d}
.card:hover{transform:translateY(-4px) rotateX(2deg)}
.art{height:116px;display:flex;align-items:center;justify-content:center;gap:5px;position:relative;overflow:hidden;font-size:clamp(38px,9vw,65px);text-shadow:0 5px 2px #3335;isolation:isolate}
.art:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;top:-95px;right:-35px;background:#ffffff55;z-index:-1}
.art:after{content:"✦  ✧  ✦";position:absolute;top:8px;left:10px;color:#fff;font-size:19px;text-shadow:0 2px 4px #555}
.art span{filter:drop-shadow(0 7px 2px #3335);transform:translateZ(18px)}
.art.a{background:linear-gradient(135deg,#13d7c8,#54ef9a)}
.art.b{background:linear-gradient(135deg,#f68bce,#9b8cff)}
.art.c{background:linear-gradient(135deg,#ffd54e,#ff8b70)}
.art.d{background:linear-gradient(135deg,#54d7ff,#78aaff)}
.art.e{background:linear-gradient(135deg,#82f2b2,#20c9a4)}
.art.f{background:linear-gradient(135deg,#d28bff,#ff8fc9)}
.art.g{background:linear-gradient(135deg,#ffe77a,#ffad48)}
.art.h{background:linear-gradient(135deg,#8be3ff,#73dfd0)}
.card h3{margin:0;padding:11px 4px 13px;font-size:15px;color:#24345f;text-shadow:0 1px #fff}
.page{display:none;position:relative;margin-top:18px;padding:16px;border:5px solid white;border-radius:27px;background:linear-gradient(145deg,#fff,#eafaff);box-shadow:0 8px 0 #1682b6,0 13px 18px #174e7555}
.page.active{display:block;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.page h2{text-align:center;color:#ec3895;font-size:26px;text-shadow:0 2px #ffd0e7}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:66px;min-height:54px;background:linear-gradient(145deg,#fff,#d9f4ff);border:3px solid #fff;border-radius:18px;padding:12px;margin:6px;font-size:19px;color:#28365f;box-shadow:0 5px 0 #7bb5d3,0 8px 12px #234c6a33;text-shadow:0 1px #fff}
.lesson{background:linear-gradient(145deg,#fff0f8,#e6f7ff);border:3px solid #fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 5px 0 #b4cfe8,0 8px 12px #4563a322}
.lesson h3{color:#dc398c}
.big{font-size:58px;text-align:center;padding:12px;filter:drop-shadow(0 6px 2px #5554)}
#message{text-align:center;color:#087b4c;font-weight:1000;min-height:26px;font-size:18px}
input{width:100%;padding:12px;border:3px solid #b8eaff;border-radius:14px;margin:8px 0;font-size:16px;background:#fff}
audio,video{width:100%;margin:10px 0;border-radius:12px}
canvas{width:100%;height:240px;border:4px dashed #a68be8;border-radius:18px;background:white;touch-action:none}
footer{text-align:center;padding:25px;color:#fff;font-weight:900;text-shadow:0 2px 3px #356}
@media(min-width:650px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.art{height:145px}.card h3{font-size:17px}}
@media(max-width:360px){.cards{gap:8px}.art{height:95px}.card h3{font-size:13px}.page{padding:11px}}
</style>
</head>
<body>
<header>
<div class="logo">🧒🏻 🐱 ⭐</div>
<h1>Little Stars</h1>
<p>LEARN • PLAY • GROW</p>
<div class="stars">⭐ My Stars: <span id="stars">0</span></div>
</header>
<main>
<div id="home">
<div class="welcome">
<h2>Welcome Little Stars! 🎈</h2>
<p>Come and explore our colourful learning world!</p>
<button class="primary" onclick="speak('Welcome to Little Stars. Let us learn and play!')">🔊 Listen</button>
</div>
<div class="cards" id="menu"></div>
</div>
<div id="page" class="page">
<button class="gold" onclick="goHome()">🏠 Home</button>
<h2 id="heading"></h2>
<div id="content"></div>
<div id="message"></div>
</div>
</main>
<footer>🌈 Made with ❤️ for Little Stars 🌟</footer>
<script>
let score=Number(localStorage.getItem("littleStars")||0);
document.getElementById("stars").textContent=score;
const sections=[
["🔤","ABC English","abc","a"],["ا ب پ","Urdu Letters","urdu","b"],["🔢","Numbers","numbers","c"],["🐘 🦁","Animals","animals","d"],
["🍎 🍌 🍇","Fruits","fruits","e"],["🔴 ⭐ 🔺","Shapes","shapes","g"],["🎨 🌈","Colors","colors","f"],["🕌 🌙","Islamic Learning","islam","b"],
["📖 🌙","Noorani Qaida","qaida","h"],["📚 ✨","Heavenly Books","books","g"],["🤲 🌸","Daily Duas","duas","e"],["🌹 🎵","Naat Sharif","naat","f"],
["🐻 🐰","Kids Cartoons","cartoons","a"],["📜 🦊","Stories","stories","c"],["🎶 🎤","Poems & Music","music","d"],["🧠 💡","General Knowledge","gk","g"],
["📝 ⭐","Quiz","quiz","e"],["🎮 🧩","Games","games","f"],["🖍️ 🎨","Drawing","drawing","c"],["🗣️ 🔊","Speaking Practice","speaking","h"],
["➕ 🔢","Maths","math","a"],["📅 🌞","Days & Months","calendar","b"],["⏰ 🕒","Clock","clock","g"],["🎤 🎧","Voice Recorder","voice","d"],["👨‍👩‍👧","Parents Corner","parents","e"]
];
document.getElementById("menu").innerHTML=sections.map(s=>`<div class="card" onclick="openSection('${s[2]}')"><div class="art ${s[3]}"><span>${s[0]}</span></div><h3>${s[1]}</h3></div>`).join("");
function reward(){score++;localStorage.setItem("littleStars",score);document.getElementById("stars").textContent=score}
function speak(t){if(!("speechSynthesis"in window)){alert("Audio is not supported in this browser.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u)}
function goHome(){document.getElementById("home").style.display="block";document.getElementById("page").classList.remove("active");if("speechSynthesis"in window)speechSynthesis.cancel()}
function tiles(arr){return arr.map(x=>`<button class="tile" onclick="speak('${String(x).replace(/'/g,"")}');reward();document.getElementById('message').textContent='Well done! ⭐'">${x}</button>`).join("")}
function openSection(id){
let html="";
switch(id){
case "abc":html="<p>Tap a letter to hear it.</p>"+tiles("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""));break;
case "urdu":html="<p>اردو حروف سیکھیں۔ حرف دبائیں اور آواز سنیں۔</p>"+tiles("ا ب پ ت ٹ ث ج چ ح خ د ڈ ذ ر ڑ ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن ں و ہ ھ ء ی ے".split(" "));break;
case "numbers":html="<p>Counting 1 to 20</p>"+tiles(Array.from({length:20},(_,i)=>String(i+1)));break;
case "animals":html=tiles(["🐘 Elephant","🦁 Lion","🐱 Cat","🐶 Dog","🐰 Rabbit","🐼 Panda","🐵 Monkey","🦒 Giraffe","🐻 Bear","🐯 Tiger","🐸 Frog","🦋 Butterfly"]);break;
case "fruits":html=tiles(["🍎 Apple","🍌 Banana","🍇 Grapes","🍊 Orange","🥭 Mango","🍉 Watermelon","🍓 Strawberry","🍍 Pineapple"]);break;
case "colors":html=tiles(["🔴 Red","🔵 Blue","🟢 Green","🟡 Yellow","🟣 Purple","🟠 Orange","⚫ Black","⚪ White"]);break;
case "shapes":html=tiles(["🔴 Circle","🟥 Square","🔺 Triangle","⭐ Star","❤️ Heart","⬛ Rectangle","💎 Diamond"]);break;
case "qaida":html=`<div class="lesson"><h3>نورانی قاعدہ 🌙</h3><p>عربی حروف اور حرکات کی ابتدائی مشق۔ درست قرآنی تلفظ کے لیے مستند قاری یا استاد سے بھی پڑھیں۔</p></div><h3>عربی حروف</h3>${tiles("ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن و ه لا ء ي".split(" "))}<h3>حرکات کی مثالیں</h3>${tiles(["بَ — زبر","بِ — زیر","بُ — پیش","بًا — دو زبر","بٍ — دو زیر","بٌ — دو پیش"])}`;break;
case "islam":html=tiles(["اللہ ایک ہے","حضرت محمد ﷺ آخری نبی ہیں","نماز","روزہ","زکوٰۃ","حج","کلمہ طیبہ","سلام کرنا","سچ بولنا","والدین کا احترام","صفائی کا خیال رکھنا"]);break;
case "info":html=tiles(["اسلام کے پانچ ارکان","ایمان کے بنیادی عقائد","مسجد","اذان","وضو","نماز","رمضان","عیدالفطر","عیدالاضحی","اسلامی مہینے","فرشتے","انبیائے کرام"]);break;
case "books":html=`<div class="lesson"><h3>آسمانی کتابیں 📚</h3><p>اسلامی تعلیمات میں معروف چار کتابیں:</p></div>${tiles(["تورات — حضرت موسیٰؑ","زبور — حضرت داؤدؑ","انجیل — حضرت عیسیٰؑ","قرآن مجید — حضرت محمد ﷺ"])}`;break;
case "duas":html=`<div class="lesson"><h3>روزمرہ کی دعائیں 🤲</h3><p>یہاں دعاؤں کے عنوانات ہیں۔ مکمل عربی متن اور ترجمہ مستند دینی ماخذ سے تصدیق کے بعد شامل کیا جائے گا۔</p></div>${tiles(["کھانے سے پہلے کی دعا","کھانے کے بعد کی دعا","سونے کی دعا","جاگنے کی دعا","گھر سے نکلنے کی دعا","علم میں اضافے کی دعا"])}`;break;
case "naat":html=`<div class="big">🌹 ﷺ 🌹</div><p>اپنی نعت آڈیو فائل منتخب کریں۔</p><input type="file" id="audioFile" accept="audio/*"><audio id="player" controls></audio><button onclick="playFile('audioFile','player')">▶ Play</button><button onclick="pauseFile('player')">⏸ Pause</button>`;break;
case "cartoons":html=`<div class="big">🐻 🐰 🦁 🐼</div><p>اپنی بچوں کی کارٹون ویڈیو منتخب کریں۔</p><input type="file" id="videoFile" accept="video/*"><video id="videoPlayer" controls></video><button onclick="playFile('videoFile','videoPlayer')">▶ Play</button><button onclick="pauseFile('videoPlayer')">⏸ Pause</button>`;break;
case "stories":html=["🐰 The Kind Rabbit — خرگوش نے دوست کی مدد کی۔","⭐ The Honest Boy — سچ بولنا اچھی عادت ہے۔","🐻 The Helpful Friend — دوستوں کی مدد کریں۔","🐦 The Thirsty Crow — سمجھ داری سے کام لیں۔"].map(x=>`<div class="lesson">${x}<button onclick="speak('${x.replace(/'/g,"")}')">🔊 Listen</button></div>`).join("");break;
case "music":html=`${tiles(["Twinkle Twinkle Little Star","Baa Baa Black Sheep","Rain Rain Go Away"])}<p>اپنی نظم یا میوزک فائل منتخب کریں:</p><input type="file" id="musicFile" accept="audio/*"><audio id="musicPlayer" controls></audio><button onclick="playFile('musicFile','musicPlayer')">▶ Play</button><button onclick="pauseFile('musicPlayer')">⏸ Pause</button>`;break;
case "gk":html=tiles(["سب سے بڑا جانور؟ نیلی وہیل","ہم کس سیارے پر رہتے ہیں؟ زمین","ہفتے میں دن؟ سات","سال میں مہینے؟ بارہ","سورج مشرق سے نکلتا ہے","پانی زندگی کے لیے ضروری ہے"]);break;
case "quiz":html=`<div class="lesson"><h3>2 + 2 = ?</h3><button onclick="check(3,4)">3</button><button onclick="check(4,4)">4</button><button onclick="check(5,4)">5</button></div><div class="lesson"><h3>Which animal says Meow?</h3><button onclick="animalAnswer('Dog')">🐶 Dog</button><button onclick="animalAnswer('Cat')">🐱 Cat</button></div>`;break;
case "games":html=`<div class="lesson"><h3>🎯 Number Guessing</h3><p>1 سے 5 تک نمبر چنیں۔</p>${[1,2,3,4,5].map(n=>`<button onclick="guess(${n})">${n}</button>`).join("")}<div id="gameResult"></div></div><div class="lesson"><h3>🐱 Animal Game</h3><p>میاؤں میاؤں کون کرتا ہے؟</p><button onclick="animalAnswer('Dog')">🐶 Dog</button><button onclick="animalAnswer('Cat')">🐱 Cat</button></div>`;break;
case "drawing":html=`<h3>اپنی تصویر بنائیں 🖍️</h3><input type="color" id="paintColor" value="#ff55aa"><button class="primary" onclick="clearDrawing()">Clear</button><canvas id="canvas"></canvas>`;break;
case "speaking":html=`<h3>لفظ لکھیں اور آواز سنیں</h3><input id="word" placeholder="Write a word"><button onclick="speak(document.getElementById('word').value)">🔊 Speak</button>`;break;
case "math":html=`<div class="lesson"><h3>3 + 2 = ?</h3><button onclick="check(4,5)">4</button><button onclick="check(5,5)">5</button><button onclick="check(6,5)">6</button></div>`;break;
case "calendar":html=tiles(["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday","January","February","March","April","May","June","July","August","September","October","November","December"]);break;
case "clock":html=`<div class="big">⏰</div><h3 id="clock"></h3><button onclick="showClock()">Show Time</button>`;break;
case "voice":html=`<p>اپنی آواز ریکارڈ کریں۔ ریکارڈنگ اسی ڈیوائس پر رہے گی۔</p><button class="primary" onclick="startVoice()">🔴 Record</button><button onclick="stopVoice()">⏹ Stop</button><audio id="voicePlayer" controls></audio><div id="voiceStatus"></div>`;break;
case "parents":html=`<div class="lesson"><h3>Parents Corner 👨‍👩‍👧</h3><p>بچوں کے ساتھ روزانہ سیکھنے کا وقت گزاریں۔ بچوں کی ذاتی معلومات آن لائن شیئر نہ کریں۔ مائیکروفون صرف والدین کی اجازت سے استعمال کریں۔</p></div>`;break;
}
document.getElementById("home").style.display="none";document.getElementById("page").classList.add("active");
document.getElementById("heading").textContent=sections.find(s=>s[2]===id)[1];
document.getElementById("content").innerHTML=html;document.getElementById("message").textContent="";
if(id==="drawing")setupDrawing();if(id==="clock")showClock();
}
function check(n,correct){document.getElementById("message").textContent=n===correct?"Correct! ⭐":"Try again!";if(n===correct)reward()}
function animalAnswer(a){document.getElementById("message").textContent=a==="Cat"?"Correct! 🐱":"Try again!";if(a==="Cat")reward()}
let secret=Math.floor(Math.random()*5)+1;
function guess(n){let r=document.getElementById("gameResult");if(n===secret){r.textContent="You won! ⭐";reward();secret=Math.floor(Math.random()*5)+1}else r.textContent="Try again!"}
function playFile(inputId,playerId){let f=document.getElementById(inputId).files[0];if(!f){alert("Please choose a file first.");return}let p=document.getElementById(playerId);p.src=URL.createObjectURL(f);p.play()}
function pauseFile(id){document.getElementById(id).pause()}
function showClock(){let e=document.getElementById("clock");if(e)e.textContent=new Date().toLocaleTimeString()}
let ctx,drawing=false;
function setupDrawing(){let c=document.getElementById("canvas");c.width=c.clientWidth*devicePixelRatio;c.height=240*devicePixelRatio;ctx=c.getContext("2d");ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=4;ctx.lineCap="round";function pos(e){let r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}c.onpointerdown=e=>{drawing=true;ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(drawing){ctx.strokeStyle=document.getElementById("paintColor").value;ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>drawing=false;c.onpointerleave=()=>drawing=false}
function clearDrawing(){let c=document.getElementById("canvas");ctx.clearRect(0,0,c.width,c.height)}
let recorder,stream;
async function startVoice(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{document.getElementById("voicePlayer").src=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));stream.getTracks().forEach(t=>t.stop())};recorder.start();document.getElementById("voiceStatus").textContent="Recording..."}catch(e){document.getElementById("voiceStatus").textContent="Microphone permission required. Open the HTTPS website."}}
function stopVoice(){if(recorder&&recorder.state==="recording"){recorder.stop();document.getElementById("voiceStatus").textContent="Recording ready!"}}
</script>
</body>
</html>
